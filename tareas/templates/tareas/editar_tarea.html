{% extends "tareas/base.html" %}

{% block title %}Editar Tarea{% endblock %}

{% block content %}
  <h2>Editar tarea: {{ tarea.titulo }}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Guardar cambios</button>
    <a href="{% url 'lista_tareas' %}" class="btn btn-secondary">Cancelar</a>
  </form>
{% endblock %}
